<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vilka Script</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }
    .page {
      display: none;
      min-height: 100vh;
      padding: 24px;
    }
    .page.active {
      display: flex;
    }
    #loginPage,
    #welcomePage {
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box {
      width: 100%;
      max-width: 380px;
    }
    input,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
    }
    button {
      border: none;
      background: #1683ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0069df;
    }
    #error {
      color: #ff7373;
    }
    #panelPage {
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }
    .site-name {
      font-size: 25px;
      font-weight: 800;
    }
    .panel-content {
      width: 100%;
      margin-top: 28px;
    }
    .panel-content h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- СТРАНИЦА 1: ВХОД -->
  <section id="loginPage" class="page active">
    <div class="box">
      <h1>Введите пароль</h1>
      <form id="loginForm">
        <input
          id="password"
          type="password"
          placeholder="Введите пароль"
          required
        >
        <button type="submit">Войти</button>
      </form>
      <p id="error"></p>
    </div>
  </section>
  <!-- СТРАНИЦА 2: ПРИВЕТСТВИЕ -->
  <section id="welcomePage" class="page">
    <div class="box">
      <h1>Добро пожаловать!</h1>
      <button onclick="showPage('panelPage')">
        Продолжить
      </button>
    </div>
  </section>
  <!-- СТРАНИЦА 3: ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <section id="panelPage" class="page">
    <header class="top-bar">
      <div class="site-name">vilka script</div>
    </header>
    <div class="panel-content">
      <h2>Панель управления</h2>
      <button onclick="manageAccounts()">
        Управление аккаунтами
      </button>
      <button onclick="launchClicker()">
        Запустить кликер
      </button>
    </div>
  </section>
  <script>
    // Переключение между тремя страницами
    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(function(page) {
        page.classList.remove("active");
      });
      document.getElementById(pageId).classList.add("active");
    }
    // Проверка пароля
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password === "scriptpatrickmaining") {
        document.getElementById("error").textContent = "";
        showPage("welcomePage");
      } else {
        document.getElementById("error").textContent =
          "Неверный пароль. Попробуй ещё раз.";
      }
    });
    // Кнопка управления аккаунтами
    function manageAccounts() {
      alert("Раздел управления аккаунтами пока не подключён.");
    }
    // Кнопка запуска кликера
    function launchClicker() {
      alert("Кликер пока не подключён.");
    }
  </script>
</body>
</html>
