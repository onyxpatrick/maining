<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }
        .page {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: #1c2230;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        input {
            width: 100%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #414b60;
            border-radius: 8px;
            background: #10131a;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #3478f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2463d8;
        }
        .error {
            color: #ff6868;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Страница 1: вход по паролю -->
    <div class="page" id="loginPage">
        <h2>🔐 Введите пароль</h2>
        <p>Введите пароль для продолжения</p>
        <input
            type="password"
            id="password"
            placeholder="Ваш пароль"
        >
        <button onclick="login()">Войти</button>
        <p id="error" class="error"></p>
    </div>
    <!-- Страница 2: приветствие -->
    <div class="page hidden" id="welcomePage">
        <h1>Добро пожаловать!</h1>
        <p>Ты успешно вошёл в систему.</p>
        <button onclick="continueToNextPage()">
            Продолжить
        </button>
    </div>
    <!-- Страница 3: интерфейс -->
    <div class="page hidden" id="mainPage">
        <h1>Личный кабинет</h1>
        <p>Добро пожаловать в твой интерфейс!</p>
        <p>Здесь мы сможем разместить функции твоего скрипта.</p>
    </div>
    <script>
        function login() {
            const password = document.getElementById("password").value;
            const correctPassword = "scriptpatrickmaining";
            if (password === correctPassword) {
                document.getElementById("loginPage").classList.add("hidden");
                document.getElementById("welcomePage").classList.remove("hidden");
            } else {
                document.getElementById("error").textContent =
                    "Неверный пароль!";
            }
        }
        document.getElementById("password").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
        function continueToNextPage() {
            document.getElementById("welcomePage").classList.add("hidden");
            document.getElementById("mainPage").classList.remove("hidden");
        }
    </script>
</body>
</html>
