<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vilka Script</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }
    /* По умолчанию все страницы скрыты */
    .page {
      display: none !important;
      min-height: 100vh;
      width: 100%;
      padding: 24px;
    }
    /* Показываем только активную страницу */
    .page.active {
      display: flex !important;
    }
    /* Страница входа */
    #loginPage,
    #welcomePage {
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box {
      width: 100%;
      max-width: 380px;
      margin: auto;
    }
    input,
    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      outline: none;
    }
    button {
      border: none;
      background: #1683ff;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0069df;
    }
    #error {
      color: #ff7373;
      min-height: 20px;
    }
    /* Панель управления */
    #panelPage {
      flex-direction: column;
      align-items: stretch;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }
    .site-name {
      font-size: 25px;
      font-weight: 800;
    }
    .panel-content {
      width: 100%;
      margin-top: 28px;
    }
    .panel-content h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <!-- СТРАНИЦА 1: ВХОД -->
  <section id="loginPage" class="page active">
    <div class="box">
      <h1>Введите пароль</h1>
      <form id="loginForm">
        <input
          id="password"
          type="password"
          placeholder="Введите пароль"
          autocomplete="off"
          required
        >
        <button type="submit">Войти</button>
      </form>
      <p id="error" role="alert"></p>
    </div>
  </section>
  <!-- СТРАНИЦА 2: ПРИВЕТСТВИЕ -->
  <section id="welcomePage" class="page">
    <div class="box">
      <h1>Добро пожаловать!</h1>
      <button id="continueButton" type="button">
        Продолжить
      </button>
    </div>
  </section>
  <!-- СТРАНИЦА 3: ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <section id="panelPage" class="page">
    <header class="top-bar">
      <div class="site-name">vilka script</div>
    </header>
    <main class="panel-content">
      <h2>Панель управления</h2>
      <button id="accountsButton" type="button">
        Управление аккаунтами
      </button>
      <button id="clickerButton" type="button">
        Запустить кликер
      </button>
    </main>
  </section>
  <script>
    const PASSWORD = "scriptpatrickmaining";
    // Переключение экранов
    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(function(page) {
        page.classList.remove("active");
      });
      const selectedPage = document.getElementById(pageId);
      if (selectedPage) {
        selectedPage.classList.add("active");
      }
    }
    // Проверка пароля
    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        const enteredPassword =
          document.getElementById("password").value;
        if (enteredPassword === PASSWORD) {
          document.getElementById("error").textContent = "";
          showPage("welcomePage");
        } else {
          document.getElementById("error").textContent =
            "Неверный пароль. Попробуй ещё раз.";
        }
      });
    // Переход к панели
    document
      .getElementById("continueButton")
      .addEventListener("click", function() {showPage("panelPage");
      });
    // Пока это демонстрационные кнопки
    document
      .getElementById("accountsButton")
      .addEventListener("click", function() {
        alert("Раздел «Управление аккаунтами» пока не подключён.");
      });
    document
      .getElementById("clickerButton")
      .addEventListener("click", function() {
        alert("Кликер пока не подключён.");
      });
  </script>
</body>
</html>
