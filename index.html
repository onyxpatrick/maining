<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный интерфейс</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .page {
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    button:hover {
      background: #0069df;
    }
    .error {
      color: #ff6b6b;
      margin-top: 15px;
    }
    #welcomePage,
    #mainPage {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Первая страница: ввод пароля -->
  <div class="page" id="passwordPage">
    <h1>Введите пароль</h1>
    <input
      type="password"
      id="passwordInput"
      placeholder="Введите пароль"
    >
    <button onclick="checkPassword()">Войти</button>
    <p class="error" id="errorMessage"></p>
  </div>
  <!-- Вторая страница: приветствие -->
  <div class="page" id="welcomePage">
    <h1>Добро пожаловать!</h1>
    <button onclick="continueToNextPage()">
      Продолжить
    </button>
  </div>
  <!-- Временная третья страница -->
  <div class="page" id="mainPage">
    <h1>Ты вошёл!</h1>
    <p>Здесь мы сделаем следующую страницу.</p>
  </div>
  <script>
    function checkPassword() {
      const password = document.getElementById("passwordInput").value;
      const correctPassword = "scriptpatrickmaining";
      if (password === correctPassword) {
        document.getElementById("passwordPage").style.display = "none";
        document.getElementById("welcomePage").style.display = "block";
      } else {
        document.getElementById("errorMessage").textContent =
          "Неверный пароль. Попробуй ещё раз.";
      }
    }
    function continueToNextPage() {
      document.getElementById("welcomePage").style.display = "none";
      document.getElementById("mainPage").style.display = "block";
    }
    document.getElementById("passwordInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
