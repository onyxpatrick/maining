<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Vilka Script</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 90%;
      max-width: 380px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
    }
    button {
      border: none;
      background: #1683ff;
      color: white;
      cursor: pointer;
    }
    #error {
      color: #ff7373;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Введите пароль</h1>
    <form id="loginForm">
      <input
        id="password"
        type="password"
        placeholder="Введите пароль"
        autocomplete="current-password"
        required
      >
      <button type="submit">Войти</button>
    </form>
    <p id="error"></p>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password === "scriptpatrickmaining") {
        window.location.href = "welcome.html";
      } else {
        document.getElementById("error").textContent =
          "Неверный пароль. Попробуй ещё раз.";
      }
    });
  </script>
</body>
</html>
